[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_PUBLIC_SUPABASE_URL = ""        # set in Netlify UI
  NEXT_PUBLIC_SUPABASE_ANON_KEY = ""   # set in Netlify UI
  SUPABASE_SERVICE_ROLE_KEY = ""       # set in Netlify UI (server only)
